<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaScope | Clinical Field Client</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #475569;
            --brand-blue: #0284c7;
            --brand-blue-hover: #0369a1;
            --alert-red: #dc2626;
            --safe-green: #059669;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            overflow: hidden;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Language Switcher */
        .lang-switcher {
            position: absolute;
            top: 24px;
            right: 24px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #f8fafc;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
        }

        .header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            padding-right: 80px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 4px 0 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
            margin: 0 0 12px 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 16px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-main);
            background: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-blue);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .status-banner {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: -8px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid transparent;
        }

        .status-banner.linked {
            background: #ecfdf5;
            color: #065f46;
            border-left-color: var(--safe-green);
            display: flex;
        }

        .status-banner.new {
            background: #f0f9ff;
            color: #0369a1;
            border-left-color: var(--brand-blue);
            display: flex;
        }

        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .chip {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #f8fafc;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .chip.active {
            background: #e0f2fe;
            color: var(--brand-blue);
            border-color: var(--brand-blue);
        }

        .file-drop {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px 20px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            margin-bottom: 24px;
            transition: all 0.2s ease;
            display: block;
        }

        .file-drop:hover {
            border-color: var(--brand-blue);
            background: #f0f9ff;
        }

        .file-drop input[type="file"] {
            display: none;
        }

        .file-drop .drop-title {
            margin: 0 0 4px 0;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1rem;
        }

        .file-drop .drop-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .file-drop.success {
            border-color: var(--safe-green);
            background: #ecfdf5;
            border-style: solid;
        }

        .file-drop.success .drop-title {
            color: var(--safe-green);
        }

        button.primary {
            width: 100%;
            padding: 14px;
            background: var(--brand-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.primary:hover {
            background: var(--brand-blue-hover);
        }

        button.primary:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* MODAL UI FOR RESULTS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--surface);
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: translateY(30px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .result-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border-radius: 12px;
            border: 2px solid transparent;
            background: #f8fafc;
            text-align: center;
        }

        .result-box.pos {
            border-color: var(--alert-red);
            background: #fef2f2;
        }

        .result-box.neg {
            border-color: var(--safe-green);
            background: #ecfdf5;
        }

        .res-classification {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .pos .res-classification {
            color: var(--alert-red);
        }

        .neg .res-classification {
            color: var(--safe-green);
        }

        .res-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 12px;
        }

        .conf-badge {
            padding: 6px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .action-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        button.secondary {
            width: 100%;
            padding: 12px;
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        button.secondary:hover {
            background: #f1f5f9;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card" id="formCard">
            <select class="lang-switcher" onchange="switchLang(this.value)">
                <option value="en">English</option>
                <option value="kn">ಕನ್ನಡ</option>
                <option value="hi">हिंदी</option>
            </select>

            <div class="header">
                <h1 data-i18n="appTitle">ParaScope Field Client</h1>
                <p data-i18n="appSubtitle">Clinical Data Acquisition Protocol</p>
            </div>

            <div class="section-label" data-i18n="secIdentity">Patient Identity</div>
            <label data-i18n="lblPhone">Contact Number</label>
            <input type="tel" id="pPhone" placeholder="10-Digit ID" maxlength="10" oninput="autoLookup(this.value)">

            <div id="passportStatus" class="status-banner"></div>

            <div class="grid-2">
                <div><label data-i18n="lblName">Legal Name</label><input type="text" id="pName" placeholder="Full Name">
                </div>
                <div><label data-i18n="lblLoc">Zone / Location</label><input type="text" id="pLoc"
                        placeholder="District Block"></div>
            </div>

            <div class="section-label" style="margin-top: 10px;" data-i18n="secVitals">Clinical Vitals</div>
            <div class="grid-2">
                <div>
                    <label data-i18n="lblTemp">Core Temp (°F)</label>
                    <input type="number" id="pTemp" placeholder="e.g. 98.6" step="any">
                </div>
                <div>
                    <label data-i18n="lblSpo2">Blood SpO2 (%)</label>
                    <input type="number" id="pSpo2" placeholder="e.g. 98" step="any">
                </div>
            </div>

            <label style="margin-top: 4px;" data-i18n="lblSymp">Symptomatic Flags</label>
            <div class="chip-group">
                <div class="chip" data-i18n="chipFever" onclick="this.classList.toggle('active')">Fever</div>
                <div class="chip" data-i18n="chipChills" onclick="this.classList.toggle('active')">Chills</div>
                <div class="chip" data-i18n="chipNausea" onclick="this.classList.toggle('active')">Nausea</div>
            </div>

            <div class="section-label" data-i18n="secDiag">Diagnostic Telemetry</div>
            <label class="file-drop" id="dropZone">
                <div class="drop-title" id="dropTitle" data-i18n="dropTitle">[ ATTACH SMEAR SLIDE ]</div>
                <div class="drop-subtitle" id="dropText" data-i18n="dropSub">Microscopy Image Upload</div>
                <input type="file" id="pImage" accept="image/*" onchange="updateFileUI(this)">
            </label>

            <button type="button" class="primary" id="submitBtn" onclick="submitPayload(event)"
                data-i18n="btnSubmit">Transmit & Analyze</button>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <div class="section-label" style="margin-bottom: 0; text-align: center;" data-i18n="secOutput">Diagnostic
                Output</div>

            <div class="result-box" id="resultCard">
                <div class="res-classification" id="resClass">--</div>
                <div class="res-meta"><span data-i18n="resLogic">Engine Logic:</span> <br> <span id="resReason"
                        style="color: var(--text-main); font-weight: 600;">--</span></div>
                <div class="conf-badge">Confidence: <span id="resConf">--%</span></div>
            </div>

            <div class="action-row">
                <button type="button" class="primary" onclick="resetAll()" data-i18n="btnEnd">Continue (Next
                    Patient)</button>
                <button type="button" class="secondary" onclick="resetForSamePatient()" data-i18n="btnClear">Clear
                    Vitals (Same Patient)</button>
            </div>
        </div>
    </div>

    <script>
        const dict = {
            "en": { appTitle: "ParaScope Field Client", appSubtitle: "Clinical Data Acquisition Protocol", secIdentity: "Patient Identity", lblPhone: "Contact Number", lblName: "Legal Name", lblLoc: "Zone / Location", secVitals: "Clinical Vitals", lblTemp: "Core Temp (°F)", lblSpo2: "Blood SpO2 (%)", lblSymp: "Symptomatic Flags", chipFever: "Fever", chipChills: "Chills", chipNausea: "Nausea", secDiag: "Diagnostic Telemetry", dropTitle: "[ ATTACH SMEAR SLIDE ]", dropSub: "Microscopy Image Upload", btnSubmit: "Transmit & Analyze", secOutput: "Diagnostic Output", resLogic: "Engine Logic:", btnClear: "Clear Vitals (Same Patient)", btnEnd: "Continue (Next Patient)" },
            "kn": { appTitle: "ಪ್ಯಾರಾಸ್ಕೋಪ್ ಫೀಲ್ಡ್ ಕ್ಲೈಂಟ್", appSubtitle: "ಕ್ಲಿನಿಕಲ್ ಡೇಟಾ ಪ್ರೋಟೋಕಾಲ್", secIdentity: "ರೋಗಿಯ ಗುರುತು", lblPhone: "ಸಂಪರ್ಕ ಸಂಖ್ಯೆ", lblName: "ಪೂರ್ಣ ಹೆಸರು", lblLoc: "ಸ್ಥಳ", secVitals: "ವೈದ್ಯಕೀಯ ವಿಟಲ್ಸ್", lblTemp: "ತಾಪಮಾನ (°F)", lblSpo2: "ರಕ್ತದ ಆಮ್ಲಜನಕ (%)", lblSymp: "ಲಕ್ಷಣಗಳು", chipFever: "ಜ್ವರ", chipChills: "ಚಳಿ", chipNausea: "ವಾಕರಿಕೆ", secDiag: "ರೋಗನಿರ್ಣಯ ಡೇಟಾ", dropTitle: "[ ಸ್ಲೈಡ್ ಲಗತ್ತಿಸಿ ]", dropSub: "ಸೂಕ್ಷ್ಮದರ್ಶಕ ಚಿತ್ರ ಅಪ್‌ಲೋಡ್", btnSubmit: "ವಿಶ್ಲೇಷಿಸಿ", secOutput: "ರೋಗನಿರ್ಣಯ ಫಲಿತಾಂಶ", resLogic: "ಎಂಜಿನ್ ತರ್ಕ:", btnClear: "ಡೇಟಾ ಅಳಿಸಿ (ಅದೇ ರೋಗಿ)", btnEnd: "ಮುಂದುವರಿಸಿ (ಮುಂದಿನ ರೋಗಿ)" },
            "hi": { appTitle: "पैरास्कोप फील्ड क्लाइंट", appSubtitle: "नैदानिक डेटा अधिग्रहण", secIdentity: "रोगी की पहचान", lblPhone: "संपर्क नंबर", lblName: "पूरा नाम", lblLoc: "स्थान", secVitals: "नैदानिक विटल्स", lblTemp: "तापमान (°F)", lblSpo2: "रक्त ऑक्सीजन (%)", lblSymp: "लक्षण", chipFever: "बुखार", chipChills: "ठंड लगना", chipNausea: "जी मिचलाना", secDiag: "निदान डेटा", dropTitle: "[ स्लाइड संलग्न करें ]", dropSub: "माइक्रोस्कोपी छवि अपलोड", btnSubmit: "विश्लेषण करें", secOutput: "निदान परिणाम", resLogic: "इंजन लॉजिक:", btnClear: "डेटा साफ़ करें (एक ही रोगी)", btnEnd: "जारी रखें (अगला मरीज)" }
        };

        function switchLang(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[lang][key]) el.innerText = dict[lang][key];
            });
        }

        const API_URL = 'http://localhost:3000/api/malaria';

        function updateFileUI(input) {
            if (input.files && input.files[0]) {
                document.getElementById('dropTitle').innerText = '✅ ' + input.files[0].name;
                document.getElementById('dropZone').classList.add('success');
            }
        }

        async function autoLookup(phone) {
            const status = document.getElementById('passportStatus');
            if (phone.length !== 10) { status.className = 'status-banner'; return; }
            try {
                const res = await fetch(`${API_URL}/patient/${phone}`);
                const data = await res.json();
                if (data.found) {
                    document.getElementById('pName').value = data.patient.name;
                    document.getElementById('pLoc').value = data.patient.location;
                    status.innerHTML = `<span>RECORD LINKED</span> <span>VISITS: ${data.history.length}</span>`;
                    status.className = 'status-banner linked';
                } else {
                    status.innerHTML = `<span>NO PRIOR RECORD</span> <span>NEW PASSPORT WILL BE GENERATED</span>`;
                    status.className = 'status-banner new';
                }
            } catch (err) { console.error(err); }
        }

        // FIX: Added event parameter to block the browser reload
        async function submitPayload(event) {
            if (event) event.preventDefault();

            const name = document.getElementById('pName').value;
            const phone = document.getElementById('pPhone').value;
            const location = document.getElementById('pLoc').value;
            const temp = document.getElementById('pTemp').value;
            const spo2 = document.getElementById('pSpo2').value;
            const file = document.getElementById('pImage').files[0];
            const btn = document.getElementById('submitBtn');

            if (!phone || phone.length !== 10 || !file) { alert("Contact Number and Microscopy Image are mandatory."); return; }

            const activeChips = document.querySelectorAll('.chip.active');
            const symptoms = Array.from(activeChips).map(c => c.innerText).join(', ');

            // FIX: Added processing text so you know it's working
            btn.disabled = true;
            btn.innerText = "Processing Telemetry...";

            try {
                const fd = new FormData();
                fd.append('name', name); fd.append('phone', phone); fd.append('location', location);
                fd.append('temperature', temp); fd.append('spo2_reading', spo2); fd.append('symptoms', symptoms);
                fd.append('smearImage', file);

                const res = await fetch(`${API_URL}/visit`, { method: 'POST', body: fd });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || "Server disconnect.");

                document.getElementById('resultModal').classList.add('active');

                document.getElementById('resClass').innerText = data.result;
                document.getElementById('resultCard').className = `result-box ${data.result.toLowerCase().includes('positive') ? 'pos' : 'neg'}`;
                document.getElementById('resConf').innerText = data.confidence + '%';
                document.getElementById('resReason').innerText = data.reasoning;

            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                // Restore original button text based on current language
                const currentLang = document.querySelector('.lang-switcher').value;
                btn.innerText = dict[currentLang].btnSubmit;
            }
        }

        function resetForSamePatient() {
            document.getElementById('pTemp').value = ''; document.getElementById('pSpo2').value = ''; document.getElementById('pImage').value = '';
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            const drop = document.getElementById('dropZone'); drop.classList.remove('success');

            document.getElementById('resultModal').classList.remove('active');
            switchLang(document.querySelector('.lang-switcher').value);
        }

        function resetAll() {
            resetForSamePatient();
            document.getElementById('pPhone').value = ''; document.getElementById('pName').value = ''; document.getElementById('pLoc').value = '';
            document.getElementById('passportStatus').className = 'status-banner';

            document.getElementById('resultModal').classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>

</html>
