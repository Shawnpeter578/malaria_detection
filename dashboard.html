<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaScope Admin // Node.js</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --text: #e4e4e7;
            --accent: #3b82f6;
            --danger: #ef4444;
            --border: #27272a;
            --muted: #a1a1aa;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, monospace;
            margin: 0;
            padding: 20px;
            font-size: 13px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: normal;
        }

        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 8px #22c55e;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 15px;
            border-left: 3px solid var(--text);
        }

        .kpi.warn {
            border-left-color: var(--danger);
        }

        .kpi span {
            display: block;
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .kpi strong {
            font-size: 1.5rem;
            font-weight: normal;
            font-variant-numeric: tabular-nums;
        }

        /* Search Bar */
        .search-bar {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            margin-bottom: 15px;
            font-family: inherit;
            text-transform: uppercase;
        }

        .search-bar:focus {
            outline: 1px solid var(--accent);
        }

        /* HTML5 Native Accordion Cards */
        details {
            background: var(--surface);
            border: 1px solid var(--border);
            margin-bottom: 8px;
            border-radius: 2px;
        }

        summary {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            list-style: none;
            font-weight: bold;
            background: #121214;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary:hover {
            background: #27272a;
        }

        details[open] summary {
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .details-content {
            padding: 0 15px 15px 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
        }

        td {
            font-variant-numeric: tabular-nums;
        }

        .badge {
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge.pos {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #ef4444;
        }

        .badge.neg {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid #22c55e;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>ParaScope // District Registry</h1>
        <div><span class="pulse"></span> DB SYNC: <span id="syncStatus">ACTIVE</span></div>
    </div>

    <div class="kpi-grid">
        <div class="kpi"><span>Registered Patients</span><strong id="kpi-pat">--</strong></div>
        <div class="kpi"><span>Total Screenings</span><strong id="kpi-inf">--</strong></div>
        <div class="kpi warn"><span>Positive Detections</span><strong id="kpi-pos"
                style="color:var(--danger)">--</strong></div>
        <div class="kpi warn"><span>Positivity Rate</span><strong id="kpi-rate">--</strong></div>
    </div>

    <input type="text" id="searchBox" class="search-bar"
        placeholder="> QUERY PATIENT INDEX (BY NAME OR PHONE NUMBER)..." onkeyup="filterPatients()">

    <div id="patientRegistry">
        <div style="text-align: center; color: var(--muted); padding: 20px;">FETCHING SECURE DATA...</div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let globalData = { patients: [], visits: [] };

        async function pollDatabase() {
            try {
                const res = await fetch(`${API_URL}/api/malaria/dashboard`);
                const data = await res.json();

                // Update KPIs
                document.getElementById('kpi-pat').innerText = data.total_patients;
                document.getElementById('kpi-inf').innerText = data.total_tests;
                document.getElementById('kpi-pos').innerText = data.positive_cases;
                document.getElementById('kpi-rate').innerText = data.positivity_rate;

                // Cache data in memory for instant searching
                globalData.patients = data.patients;
                globalData.visits = data.visits;

                // Only re-render if the search box is currently empty (so we don't interrupt a user searching)
                if (document.getElementById('searchBox').value === '') {
                    renderPatients(globalData.patients);
                }
            } catch (err) { console.error('Poll failed:', err); }
        }

        // Renders the HTML5 Accordion Cards
        function renderPatients(patients) {
            const container = document.getElementById('patientRegistry');

            if (patients.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--muted)">NO RECORDS FOUND</div>`;
                return;
            }

            container.innerHTML = patients.map(p => {
                // Find all visits for this specific patient
                const pVisits = globalData.visits.filter(v => v.patient_id === p.id);

                // If they have ever tested positive, flag the card in Red
                const hasPos = pVisits.some(v => v.result.toLowerCase().includes('positive'));
                const statusBadge = hasPos ? `<span style="color:var(--danger)">[ALERT: POSITIVE HISTORY]</span>` : `<span style="color:#22c55e">[CLEAR]</span>`;

                // Build the table rows for their history
                const visitRows = pVisits.map(v => `
                    <tr>
                        <td style="color:var(--muted)">${new Date(v.created_at).toISOString().split('T')[0]}</td>
                        <td>T: ${v.temperature}°F | O2: ${v.spo2_reading}%</td>
                        <td style="color:var(--muted)">${v.symptoms || '--'}</td>
                        <td><span class="badge ${v.result.toLowerCase().includes('positive') ? 'pos' : 'neg'}">${v.result}</span></td>
                        <td style="color:var(--muted); font-size:10px;">${v.reasoning}</td>
                    </tr>
                `).join('');

                return `
                <details>
                    <summary>
                        <span><span style="color:var(--accent)">UUID: ${p.id.substring(0, 6)}</span> | ${p.name.toUpperCase()} | PH: ${p.phone}</span>
                        <span>VISITS: ${pVisits.length} &nbsp; ${statusBadge}</span>
                    </summary>
                    <div class="details-content">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date (UTC)</th>
                                    <th>Vitals</th>
                                    <th>Symptoms</th>
                                    <th>Classification</th>
                                    <th>Engine Logic Path</th>
                                </tr>
                            </thead>
                            <tbody>${visitRows || '<tr><td colspan="5" style="text-align:center;">No visit records found.</td></tr>'}</tbody>
                        </table>
                    </div>
                </details>
                `;
            }).join('');
        }

        // Zero-Latency Client-Side Search
        function filterPatients() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = globalData.patients.filter(p =>
                p.name.toLowerCase().includes(query) || p.phone.includes(query)
            );
            renderPatients(filtered);
        }

        // Poll every 5 seconds to keep data fresh
        setInterval(pollDatabase, 5000);
        pollDatabase();
    </script>
</body>

</html>
