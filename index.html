<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaScope | Malaria Triage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1A73E8', surface: '#F8F9FA' } } } }
    </script>
</head>

<body class="bg-surface text-slate-900 min-h-screen">

    <header
        class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <i data-lucide="activity" class="text-primary w-7 h-7"></i>
            <h1 class="text-lg font-semibold tracking-tight text-slate-700">ParaScope Triage</h1>
        </div>
        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-primary font-bold text-xs">P
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">

        <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4 flex items-center gap-2">
                <i data-lucide="user" class="w-4 h-4"></i> Patient Information
            </h2>
            <div class="space-y-4">
                <input type="text" id="pName" placeholder="Full Name"
                    class="w-full bg-slate-50 px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-200 focus:border-primary outline-none transition">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="pPhone" placeholder="Phone"
                        class="bg-slate-50 px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-200 outline-none">
                    <input type="text" id="pLoc" placeholder="Village"
                        class="bg-slate-50 px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-200 outline-none">
                </div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4 flex items-center gap-2">
                <i data-lucide="thermometer" class="w-4 h-4"></i> Clinical Vitals
            </h2>
            <input type="number" id="pTemp" placeholder="Temperature (°F)"
                class="w-full bg-slate-50 px-4 py-3 rounded-lg border border-slate-200 mb-6 outline-none">

            <p class="text-sm font-medium mb-3">Reported Symptoms</p>
            <div class="flex flex-wrap gap-2" id="symptomGrid">
                <button class="px-4 py-2 rounded-full border border-slate-300 text-sm hover:bg-blue-50 transition"
                    onclick="this.classList.toggle('bg-blue-600'); this.classList.toggle('text-white')">Fever >
                    48h</button>
                <button class="px-4 py-2 rounded-full border border-slate-300 text-sm hover:bg-blue-50 transition"
                    onclick="this.classList.toggle('bg-blue-600'); this.classList.toggle('text-white')">Chills</button>
                <button class="px-4 py-2 rounded-full border border-slate-300 text-sm hover:bg-blue-50 transition"
                    onclick="this.classList.toggle('bg-blue-600'); this.classList.toggle('text-white')">Headache</button>
            </div>
        </section>

        <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
            <h2
                class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4 text-left flex items-center gap-2">
                <i data-lucide="camera" class="w-4 h-4"></i> Diagnostic Image
            </h2>
            <label for="pImage" class="block cursor-pointer group">
                <div
                    class="border-2 border-dashed border-slate-200 rounded-xl py-8 group-hover:border-primary transition">
                    <i data-lucide="plus-circle" class="w-8 h-8 text-slate-400 mx-auto mb-2"></i>
                    <p class="text-sm font-medium text-slate-600">Attach Smear/RDT Image</p>
                </div>
            </label>
            <input type="file" id="pImage" accept="image/*" class="hidden">
            <div id="fileName" class="mt-2 text-xs font-semibold text-primary"></div>
        </section>

        <button id="submitBtn" onclick="submitData()"
            class="w-full bg-primary text-white py-4 rounded-xl font-bold hover:bg-blue-600 shadow-lg shadow-blue-200 transition">
            Run Edge AI Inference
        </button>
    </main>

    <script>
        lucide.createIcons();
        // ... (Keep your submitData() logic here)
    </script>
</body>

</html>
